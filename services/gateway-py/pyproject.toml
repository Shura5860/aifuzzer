[project]
name = "aifuzzer-gateway"
version = "0.1.0"
description = "Deterministic Target Gateway & Oracle Service for AIFuzzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    "llama-cpp-python>=0.3.36",
    "protobuf>=5.29.0",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
exclude = [
    "src/gateway/proto",
    ".venv",
]
line-length = 120
